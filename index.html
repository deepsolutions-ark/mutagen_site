<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutagen | Research peptides</title>
  <meta name="description" content="The Mutagen catalog of research peptides, listed by strength and price. For laboratory research use only.">
  <meta name="theme-color" content="#fafbf9">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/products.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/catalog.js" defer></script>
</head>
<body data-page="home">
  <div data-site-header></div>

  <main id="main">
    <section class="intro wrap">
      <h1>Research peptides</h1>
      <p class="intro__lede">Choose a compound and strength, add it to your cart, and send us an order request. Everything we sell is for laboratory research use only.</p>
    </section>

    <section id="catalog" class="catalog wrap" data-catalog aria-labelledby="catalog-title">
      <div class="catalog__bar">
        <h2 id="catalog-title" class="catalog__title">Catalog <span class="catalog__count" data-count></span></h2>
        <div class="catalog__controls">
          <label class="search">
            <span class="visually-hidden">Search compounds</span>
            <input type="search" data-search placeholder="Search, e.g. BPC-157" autocomplete="off" spellcheck="false">
          </label>
          <label class="select">
            <span>Sort</span>
            <select data-sort>
              <option value="catalog">Catalog order</option>
              <option value="price-asc">Price, low to high</option>
              <option value="price-desc">Price, high to low</option>
            </select>
          </label>
          <div class="toggle" role="group" aria-label="Layout">
            <button type="button" data-view="tiles" aria-pressed="true">Tiles</button>
            <button type="button" data-view="list" aria-pressed="false">List</button>
          </div>
        </div>
      </div>
      <p class="visually-hidden" role="status" data-status></p>
      <div data-results></div>
      <noscript><p>The catalog needs JavaScript. Turn it on in your browser to see products and prices.</p></noscript>
    </section>

    <section class="ruo wrap" aria-labelledby="ruo-title">
      <div class="ruo__frame bracket bracket--green">
        <h2 id="ruo-title">Research use only</h2>
        <p data-config="disclaimer"></p>
        <p>By ordering, you confirm you are <span data-config="minAge">21</span> or older and buying for laboratory research. <a href="policies.html#research-use">Read the research use policy</a>.</p>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
</body>
</html>
